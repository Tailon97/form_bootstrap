<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="container">
            <header>
                <h1>Vagas de Emprego</h1>
                <h2>Cadastre-se</Cadastre-se></h2>
            </header>

        <form id="form-cadastro">
            <label class="form-label" for="nome">Seu Nome:</label>
            <input class="form-control mb-3" type="text" id="nome" placeholder="Nome Completo" required>

            <label for="email" class="form-label">Seu email</label>
            <input id="email" type="email" class="form-control mb-3" placeholder="abc123@email.com" required>

            <label for="fone" class="form-label">Telefone/Celular</label>
            <input id="fone" type="tel" class="mb-3 form-control" placeholder="(99)99999-9999" required>

            <input type="checkbox" id="aceito-termo" class="form-check-input">
            <label for=" aceito-termo" class="form-check-label">Aceitos os termos de uso</label>

            <div class="botoes-confi">
                <button type="submit" class="btn btn-primary">Cadastrar</button>
                <button type="reset" class="btn btn-secondary">Limpar Formulário</button>
            </div>

        </form>
        <div id="mensagem-sucesso" class="mensagem-sucesso">
            <h2>Cadastro Realizado com Sucesso!</h2>
            <p>Obrigado por se cadastrar. Em breve entraremos em contato.</p>
            <button id="fechar-mensagem" class="btn btn-primary">Fechar</button>
        </div>
    </div>

    <footer> &copy;Todos os direitos reservados</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./main.js"></script>

</body>

</html>
